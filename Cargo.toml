[package]
name = "modernbasic"
version = "0.8.2"
edition = "2021"
rust-version = "1.74"
description = "A native, bounded, line-numbered BASIC for modern 64-bit computers"
publish = false

[dependencies]
num-bigint = { path = "src/vendor/num-bigint" }
num-integer = { path = "src/vendor/num-integer" }
num-traits = { path = "src/vendor/num-traits" }
# Minimal CPU table core. Pins keep the full offline bundle on Rust 1.75;
# generated applications use the same vendored versions.
polars-core = { version = "=0.36.2", default-features = false, features = ["algorithm_group_by"] }
# Already vendored by the table core; explicit calendar use needs no clock/timezone.
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
indexmap = "=2.2.6"
rayon = "=1.8.1"
rayon-core = "=1.12.1"
ethnum = "=1.3.2"
ahash = "=0.8.11"

[lib]
name = "modernbasic"
path = "src/lib.rs"

[[bin]]
name = "modernbasic"
path = "src/main.rs"

# Keep routine development and test builds compact. Tests inherit this profile.
# Opt in to source-level debugging with CARGO_PROFILE_DEV_DEBUG=2 (or
# CARGO_PROFILE_TEST_DEBUG=2); incremental compilation can also be enabled
# explicitly with CARGO_INCREMENTAL=1 when disk space permits.
[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
