[package]
name = "ruststrument"
version = "2.0.0"
edition = "2021"
rust-version = "1.75"
description = "Independent physical-model and hybrid-sample musical instrument library"
publish = false

[dependencies]
rustfft = "=6.1.0"
symphonia = { version = "=0.5.3", features = ["all"] }

[lib]
name = "ruststrument"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "ruststrument"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
